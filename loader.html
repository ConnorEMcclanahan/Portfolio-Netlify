<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Loader</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }
    #loader {
      position: absolute; top:0; left:0;
      width:100%; height:100%;
      z-index: 10;
    }
    #loading-text {
      position: absolute;
      bottom: 5%;
      width: 100%;
      text-align: center;
      color: #ccc;
      font-family: 'Raleway', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 1px;
      animation: pulse 1.2s ease-in-out infinite;
      z-index: 11;
    }
    @keyframes pulse {
      0%,100% { opacity: 0.6; }
      50%     { opacity: 1;   }
    }
  </style>
</head>
<body>
  <div id="loader"></div>
  <div id="loading-text">Loading…</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const loaderEl = document.getElementById('loader');
    const textEl   = document.getElementById('loading-text');

    // basic three.js setup
    const scene    = new THREE.Scene();
    const camera   = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 1, 1000);
    camera.position.set(0, 0, 200);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    loaderEl.appendChild(renderer.domElement);

    // simple lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.3));
    const dir = new THREE.DirectionalLight(0xffffff, 0.7);
    dir.position.set(1,1,1);
    scene.add(dir);

    // helper random
    function rand(min, max){ return min + Math.random()*(max-min); }

    function makeGlobe() {
      const group = new THREE.Group();
      group.position.set(rand(-100,100), rand(-60,60), 0);
      const s = rand(0.6, 1.2);
      group.scale.set(s,s,s);
      scene.add(group);

      const R = 40;

      // — wireframe with fewer lines —
      const geo = new THREE.SphereGeometry(R, 16, 16);
      const edges = new THREE.EdgesGeometry(geo);
      const wire = new THREE.LineSegments(
        edges,
        new THREE.LineBasicMaterial({ color: 0x6E07F3, transparent:true, opacity:0.8 })
      );
      group.add(wire);

      // — 20 sparse spikes —
      const spikeCount = 40;
      const spikeVerts = new Float32Array(spikeCount * 2 * 3);
      let si = 0;
      for(let i=0; i<spikeCount; i++){
        // random direction on sphere
        const θ = Math.acos(rand(-1,1)), ϕ = rand(0, Math.PI*2);
        const x = R*Math.sin(θ)*Math.cos(ϕ);
        const y = R*Math.sin(θ)*Math.sin(ϕ);
        const z = R*Math.cos(θ);
        spikeVerts[si++] = x; spikeVerts[si++] = y; spikeVerts[si++] = z;
        const scale = 1 + rand(0.15,0.35);
        spikeVerts[si++] = x*scale; spikeVerts[si++] = y*scale; spikeVerts[si++] = z*scale;
      }
      const spikeGeo = new THREE.BufferGeometry();
      spikeGeo.setAttribute('position', new THREE.BufferAttribute(spikeVerts,3));
      const spikes = new THREE.LineSegments(
        spikeGeo,
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent:true, opacity:0.3 })
      );
      group.add(spikes);

      // — audio-wave core (one horizontal) —
      const wavePoints = [];
      for(let i=0;i<80;i++){
        const t = rand(-R*0.6, R*0.6);
        const h = rand(-R*0.2, R*0.2) * (1 - Math.abs(t)/(R*0.6));
        wavePoints.push(new THREE.Vector3(t,  h, 0));
        wavePoints.push(new THREE.Vector3(t, -h, 0));
      }
      const waveGeo = new THREE.BufferGeometry().setFromPoints(wavePoints);
      const waveMat = new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.6 });
      const wave1 = new THREE.LineSegments(waveGeo, waveMat);
      group.add(wave1);

      // — duplicate & rotate: vertical front (around X) —
      const wave2 = wave1.clone();
      wave2.rotation.x = Math.PI/2;
      group.add(wave2);

      // — duplicate & rotate: vertical side (around Y) —
      const wave3 = wave1.clone();
      wave3.rotation.y = Math.PI/2;
      group.add(wave3);

      return { group, speed: rand(0.1,0.3) };
    }

    // spawn multiple globes
    const globes = [];
    for(let i=0;i<5;i++){
      globes.push(makeGlobe());
    }

    // animation loop
    let prev = 0;
    function animate(now=0){
      const dt = (now - prev)/1000;
      prev = now;
      globes.forEach(g=>{
        g.group.rotation.y += dt * g.speed;
        g.group.rotation.x += dt * g.speed * 0.4;
      });
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // handle resize
    window.addEventListener('resize', ()=>{
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // fade out loader when done
    window.addEventListener('load', ()=>{
      loaderEl.style.transition = 'opacity 0.6s';
      textEl.style.transition   = 'opacity 0.6s';
      loaderEl.style.opacity = 0;
      textEl.style.opacity   = 0;
      setTimeout(()=>{
        loaderEl.remove();
        textEl.remove();
      }, 600);
    });
  </script>
</body>
</html>
